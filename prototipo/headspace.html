<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Headspace — prototipo</title>
<script src="hls.min.js"></script>
<script src="pistas.js"></script>
<style>
  :root { --lima: #9be22a; --pantalla: #060a3a; --led: #7dff3a; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: "Trebuchet MS", Tahoma, sans-serif; color: #eaffd0; }
  #fondo { position: fixed; inset: 0; width: 100%; height: 100%; }
  #cabeza { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    height: min(88vh, 112vw); aspect-ratio: 600 / 760; }
  #cabeza svg { position: absolute; inset: 0; width: 100%; height: 100%;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,.6)); }
  /* Todo lo de encima se ubica en % del dibujo (viewBox 600x760). */
  .en { position: absolute; }
  #pantalla { left: 28.3%; top: 19.7%; width: 43.4%; height: 23.7%; border-radius: 9% / 13%; }
  #caratula { left: 30.2%; top: 21.2%; width: 9%; aspect-ratio: 1; border-radius: 6px;
    object-fit: cover; opacity: .9; box-shadow: 0 0 10px rgba(125,255,58,.4); }
  #textos { left: 40.5%; top: 21.6%; width: 29%; font-size: min(1.55vh, 1.9vw); line-height: 1.25;
    color: var(--led); text-shadow: 0 0 6px rgba(125,255,58,.7); white-space: nowrap; overflow: hidden; }
  #titulo { font-weight: bold; }
  #artista { opacity: .75; }
  #botones { left: 31%; top: 13.2%; width: 38%; height: 5.6%; display: flex; justify-content: space-between; }
  .boton { width: 22%; height: 100%; border-radius: 50% / 70%; border: 2px solid #2d5200; cursor: pointer;
    background: radial-gradient(circle at 50% 25%, #fff 0%, #e4f6c4 18%, #9cc95e 55%, #4f7c12 100%);
    color: #183400; font-size: min(1.8vh, 2.2vw); font-weight: bold;
    box-shadow: inset 0 -3px 5px rgba(0,0,0,.35), 0 2px 4px rgba(0,0,0,.4); }
  .boton:active { transform: translateY(1px); box-shadow: inset 0 2px 5px rgba(0,0,0,.5); }
  #barra { left: 30%; top: 44.3%; width: 40%; }
  #tiempo { left: 30%; top: 47.2%; width: 40%; text-align: center; font-size: min(1.5vh, 1.8vw);
    color: #1f3d00; font-weight: bold; }
  #volumen { left: 38%; top: 82.6%; width: 24%; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 8px; border-radius: 4px;
    background: linear-gradient(#20400a, #4c7d14); border: 1px solid #1a3300; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 40% 30%, #fff, #b9e06d 45%, #4a7a10); border: 1px solid #1a3300; cursor: pointer; }
  #aviso { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 13px;
    color: #fff; text-shadow: 0 1px 3px #000; }
</style>
</head>
<body>
<canvas id="fondo"></canvas>

<div id="cabeza">
  <svg viewBox="0 0 600 760" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="piel" cx="50%" cy="28%" r="70%">
        <stop offset="0" stop-color="#e6ff7a"/><stop offset=".45" stop-color="#8fd61c"/>
        <stop offset=".85" stop-color="#3f8a06"/><stop offset="1" stop-color="#245200"/>
      </radialGradient>
      <linearGradient id="cromo" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#5e6a6e"/><stop offset=".35" stop-color="#f2f6f7"/>
        <stop offset=".6" stop-color="#9aa6aa"/><stop offset="1" stop-color="#3c4649"/>
      </linearGradient>
      <radialGradient id="cono" cx="50%" cy="45%" r="55%">
        <stop offset="0" stop-color="#d9e0e2"/><stop offset=".25" stop-color="#5b6467"/>
        <stop offset=".6" stop-color="#2b3133"/><stop offset=".85" stop-color="#9aa5a8"/><stop offset="1" stop-color="#3a4245"/>
      </radialGradient>
      <radialGradient id="ojo" cx="50%" cy="40%" r="60%">
        <stop offset="0" stop-color="#f6ffd8"/><stop offset=".4" stop-color="#b6ff3c"/><stop offset="1" stop-color="#1d4a00"/>
      </radialGradient>
      <linearGradient id="vidrio" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <!-- Cápsulas de parlantes a los lados (detrás de la cabeza) -->
    <g id="oidoIzq">
      <rect x="18" y="205" width="118" height="210" rx="56" fill="url(#cromo)" stroke="#1d2629" stroke-width="4"/>
      <g class="parlante" transform="translate(77 262)"><circle r="40" fill="url(#cono)"/><circle r="13" fill="#1a1f21"/></g>
      <g class="parlante" transform="translate(77 358)"><circle r="40" fill="url(#cono)"/><circle r="13" fill="#1a1f21"/></g>
    </g>
    <use href="#oidoIzq" transform="translate(600 0) scale(-1 1)"/>

    <!-- Cabeza -->
    <path d="M300 34 C440 34 528 120 532 252 C536 356 498 426 470 498 C436 590 386 704 300 726
             C214 704 164 590 130 498 C102 426 64 356 68 252 C72 120 160 34 300 34 Z"
          fill="url(#piel)" stroke="#1f4500" stroke-width="5"/>
    <!-- Brillo del plástico -->
    <ellipse cx="300" cy="62" rx="105" ry="20" fill="url(#vidrio)" opacity=".7"/>

    <!-- Bandeja de botones y marco de la pantalla -->
    <rect x="178" y="92" width="244" height="58" rx="29" fill="#3d7a06" stroke="#1f4500" stroke-width="4"/>
    <rect x="160" y="140" width="280" height="205" rx="30" fill="#2a5c02" stroke="#173a00" stroke-width="5"/>
    <rect x="170" y="150" width="260" height="180" rx="24" fill="var(--pantalla)"/>

    <!-- Placa de la barra de progreso -->
    <rect x="172" y="330" width="256" height="50" rx="20" fill="#b5ea55" stroke="#1f4500" stroke-width="3"/>

    <!-- Ojos tipo visor: brillan con la música -->
    <g id="ojos">
      <path d="M150 455 C195 420 250 430 272 462 C232 486 182 484 150 455 Z" fill="url(#ojo)" stroke="#173a00" stroke-width="4"/>
      <path d="M450 455 C405 420 350 430 328 462 C368 486 418 484 450 455 Z" fill="url(#ojo)" stroke="#173a00" stroke-width="4"/>
    </g>
    <!-- Nariz -->
    <path d="M300 478 C292 520 286 548 300 560 C314 548 308 520 300 478 Z" fill="#4e9a0a" opacity=".7"/>
    <!-- Boca: medidor de nivel -->
    <rect x="222" y="595" width="156" height="34" rx="17" fill="#173a00"/>
    <g id="boca"></g>
  </svg>

  <canvas id="pantalla" class="en"></canvas>
  <img id="caratula" class="en" alt="">
  <div id="textos" class="en"><div id="titulo">—</div><div id="artista">Pulsa ▶ para empezar</div></div>
  <div id="botones" class="en">
    <button class="boton" id="bAnt" title="Anterior">⏮</button>
    <button class="boton" id="bPlay" title="Play / pausa">▶</button>
    <button class="boton" id="bSig" title="Siguiente">⏭</button>
    <button class="boton" id="bStop" title="Detener">■</button>
  </div>
  <input id="barra" class="en" type="range" min="0" max="1000" value="0">
  <div id="tiempo" class="en">0:00 / 0:00</div>
  <input id="volumen" class="en" type="range" min="0" max="100" value="80" title="Volumen">
</div>
<div id="aviso"></div>

<script src="nucleo.js"></script>
<script src="tunel.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let t = 0;

const fondo = $("fondo");

// ---- Pantalla: barras LED con picos ----
const pan = $("pantalla"), pg = pan.getContext("2d");
const picos = new Array(28).fill(0);
function dibujarPantalla(d) {
  const r = pan.getBoundingClientRect();
  if (pan.width !== Math.round(r.width)) { pan.width = Math.round(r.width); pan.height = Math.round(r.height); }
  if (!pan.width || !pan.height) return;
  const w = pan.width, h = pan.height, n = picos.length, base = h * 0.95, alto = h * 0.52, ancho = w * 0.86 / n;
  pg.clearRect(0, 0, w, h);
  for (let i = 0; i < n; i++) {
    const idx = Math.floor(Math.pow(i / n, 1.7) * 220) + 1;
    const v = d[idx] / 255;
    picos[i] = Math.max(picos[i] - 0.012, v);
    const x = w * 0.07 + i * ancho, segs = Math.round(v * 14);
    for (let s = 0; s < segs; s++) {
      pg.fillStyle = s > 11 ? "#ff5a3a" : s > 8 ? "#ffe03a" : "#7dff3a";
      pg.fillRect(x, base - (s + 1) * alto / 14, ancho * 0.72, alto / 14 - 2);
    }
    pg.fillStyle = "#e9ffd2";
    pg.fillRect(x, base - picos[i] * alto - 3, ancho * 0.72, 2);
  }
}

// ---- Cabeza: parlantes que laten, ojos que brillan, boca con nivel ----
const parlantes = document.querySelectorAll(".parlante"), ojos = $("ojos"), boca = $("boca");
for (let i = 0; i < 12; i++) {
  const seg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  seg.setAttribute("x", 232 + i * 12); seg.setAttribute("y", 603); seg.setAttribute("width", 9);
  seg.setAttribute("height", 18); seg.setAttribute("rx", 2); boca.appendChild(seg);
}
function animarCabeza(bajo, medio) {
  const esc = 1 + bajo * 0.16;
  parlantes.forEach(p => {
    const base = p.getAttribute("transform").split(" scale")[0];
    p.setAttribute("transform", `${base} scale(${esc.toFixed(3)})`);
  });
  ojos.style.opacity = (0.55 + medio * 0.9).toFixed(2);
  const encendidos = Math.round(medio * 18);
  boca.querySelectorAll("rect").forEach((s, i) =>
    s.setAttribute("fill", i < encendidos ? (i > 9 ? "#ff5a3a" : "#7dff3a") : "#2d5a0c"));
}

R.cadaCuadro((tiempo) => {
  t = tiempo;
  const d = R.espectro();
  const bajo = R.energia(d, 1, 8), medio = R.energia(d, 8, 60), agudo = R.energia(d, 60, 200);
  dibujarTunel(fondo, d, bajo, agudo, t, PALETAS.fuego);
  dibujarPantalla(d);
  animarCabeza(bajo, medio);
});
</script>
</body>
</html>
