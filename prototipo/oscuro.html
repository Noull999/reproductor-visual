<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oscuro — prototipo</title>
<script src="hls.min.js"></script>
<script src="pistas.js"></script>
<style>
  :root { --fondo: #121212; --panel: #191919; --linea: #262626; --texto: #d9d9d9; --suave: #8a8a8a; --acento: #3d8fd6; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto);
    font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  body { display: grid; grid-template-rows: 34px 1fr 96px; }
  #ambiente { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  body > *:not(#ambiente) { position: relative; z-index: 1; }
  #espectro { width: 100%; height: 34px; border-bottom: 1px solid var(--linea); background: rgba(10,10,10,.55); }
  main { display: grid; grid-template-columns: minmax(0, 45%) 1fr; min-height: 0; }
  #arte { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 28px; }
  #arte img { box-shadow: 0 30px 80px rgba(0,0,0,.6); border-radius: 6px; }
  #arte img { max-width: 100%; max-height: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  #lista { overflow-y: auto; border-left: 1px solid var(--linea); padding: 8px 0; background: rgba(14,14,14,.55);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  .fila { display: grid; grid-template-columns: 44px 34px 1fr 52px; align-items: center; gap: 10px;
    padding: 5px 16px; font-size: 13px; cursor: pointer; }
  .fila:hover { background: #222; }
  .fila.sonando { background: #233447; color: #fff; }
  .fila img { width: 44px; height: 44px; object-fit: cover; border-radius: 2px; }
  .fila .n, .fila .dur { color: var(--suave); font-variant-numeric: tabular-nums; }
  .fila .nombre { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer { display: grid; grid-template-columns: 96px 230px 1fr 160px; align-items: center; gap: 14px;
    background: rgba(22,22,22,.72); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-top: 1px solid var(--linea); padding-right: 18px; }
  #caratula { width: 96px; height: 96px; object-fit: cover; }
  #titulo { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #artista { color: var(--suave); font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .centro { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .botones { display: flex; justify-content: center; gap: 22px; }
  .botones button { background: none; border: none; color: var(--texto); font-size: 20px; cursor: pointer; padding: 2px 6px; }
  .botones button:hover { color: #fff; }
  #corazon { color: #e0324b; }
  .onda { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px;
    color: var(--suave); font-size: 12px; font-variant-numeric: tabular-nums; }
  #ondaCanvas { width: 100%; height: 34px; cursor: pointer; display: block; }
  #volumen { width: 100%; accent-color: var(--acento); }
  #tiempo { display: none; }
</style>
</head>
<body>
<canvas id="ambiente"></canvas>
<canvas id="espectro"></canvas>
<main>
  <div id="arte"><img id="grande" alt=""></div>
  <div id="lista"></div>
</main>
<footer>
  <img id="caratula" alt="">
  <div><div id="titulo">—</div><div id="artista"></div></div>
  <div class="centro">
    <div class="botones">
      <button id="corazon" title="Me gusta">♥</button>
      <button id="bStop" title="Detener">■</button>
      <button id="bAnt" title="Anterior">⏮</button>
      <button id="bPlay" title="Play / pausa">▶</button>
      <button id="bSig" title="Siguiente">⏭</button>
    </div>
    <div class="onda"><span id="tActual">0:00</span><canvas id="ondaCanvas"></canvas><span id="tTotal">0:00</span></div>
  </div>
  <input id="volumen" type="range" min="0" max="100" value="80" title="Volumen">
  <span id="tiempo"></span>
</footer>

<script src="nucleo.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let ondaActual = [];
R.alCambiar((p) => { $("grande").src = p.caratula || ""; ondaActual = p.onda || []; $("tTotal").textContent = R.fmt(p.duracion); });

function lienzo(c) {   // ajusta el canvas a su tamaño en pantalla
  const r = c.getBoundingClientRect();
  if (c.width !== Math.round(r.width) || c.height !== Math.round(r.height)) { c.width = Math.round(r.width); c.height = Math.round(r.height); }
  return c.width && c.height ? c.getContext("2d") : null;
}

// Forma de onda real de SoundCloud: lo ya escuchado en azul, el resto gris.
const oc = $("ondaCanvas");
oc.addEventListener("click", (e) => { const r = oc.getBoundingClientRect(); R.saltarA((e.clientX - r.left) / r.width); });
function dibujarOnda() {
  const g = lienzo(oc); if (!g) return;
  const w = oc.width, h = oc.height, n = ondaActual.length, prog = R.progreso();
  g.clearRect(0, 0, w, h);
  if (!n) { g.fillStyle = "#333"; g.fillRect(0, h / 2 - 1, w, 2); return; }
  const ancho = w / n;
  for (let i = 0; i < n; i++) {
    const v = Math.max(0.04, ondaActual[i]) * h * 0.95;
    g.fillStyle = i / n < prog ? "#4f9fe6" : "#5a5a5a";
    g.fillRect(i * ancho, (h - v) / 2, Math.max(1, ancho - 1), v);
  }
  $("tActual").textContent = R.fmt(R.audio.currentTime);
}

// Tira de espectro arriba, como en foobar.
const ec = $("espectro");
function dibujarEspectro() {
  const g = lienzo(ec); if (!g) return;
  const d = R.espectro(), w = ec.width, h = ec.height, n = 140, ancho = w / n;
  g.clearRect(0, 0, w, h);
  g.fillStyle = "#8a8a8a";
  for (let i = 0; i < n; i++) {
    const v = d[Math.floor(Math.pow(i / n, 1.6) * 300) + 1] / 255;
    g.fillRect(i * ancho, h - v * h, Math.max(1, ancho - 2), v * h);
  }
}

// Fondo ambiental: manchas de luz con los colores de la carátula, que flotan y laten.
let colores = [[60, 60, 70], [40, 40, 50], [80, 80, 90]];
function coloresDe(url) {
  const img = new Image();
  img.crossOrigin = "anonymous";   // SoundCloud permite leer sus carátulas
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = c.height = 24;
    const g = c.getContext("2d"); g.drawImage(img, 0, 0, 24, 24);
    const px = g.getImageData(0, 0, 24, 24).data;
    // Los 3 colores más saturados (y no casi negros) de la carátula.
    const lista = [];
    for (let i = 0; i < px.length; i += 4) {
      const r = px[i], gg = px[i + 1], b = px[i + 2], max = Math.max(r, gg, b), min = Math.min(r, gg, b);
      lista.push({ c: [r, gg, b], s: (max - min) * (max > 40 ? 1 : 0.1) });
    }
    lista.sort((a, b) => b.s - a.s);
    colores = [lista[0].c, lista[Math.floor(lista.length * 0.08)].c, lista[Math.floor(lista.length * 0.2)].c];
  };
  img.src = url;
}
R.alCambiar((p) => { if (p.caratula) coloresDe(p.caratula); });
if (R.pistas.length) coloresDe(R.pistas[0].caratula);

const amb = $("ambiente");
let golpe = 0;
function dibujarAmbiente(t) {
  if (amb.width !== innerWidth || amb.height !== innerHeight) { amb.width = innerWidth; amb.height = innerHeight; }
  const g = amb.getContext("2d"), w = amb.width, h = amb.height;
  if (!w || !h) return;
  const bajo = R.energia(R.espectro(), 1, 8);
  golpe = Math.max(golpe * 0.9, bajo);
  g.fillStyle = "#0b0b0d"; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = "lighter";
  colores.forEach((c, i) => {
    const x = w * (0.3 + 0.35 * Math.sin(t * 0.13 + i * 2.1)), y = h * (0.45 + 0.3 * Math.cos(t * 0.11 + i * 1.7));
    const r = Math.max(w, h) * (0.32 + golpe * 0.18);
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${0.32 + golpe * 0.3})`);
    grad.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = grad; g.fillRect(0, 0, w, h);
  });
  g.globalCompositeOperation = "source-over";
}

R.cadaCuadro((t) => { dibujarAmbiente(t); dibujarOnda(); dibujarEspectro(); });
</script>
</body>
</html>
