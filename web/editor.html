<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor</title>
<link rel="stylesheet" href="vidrio-liquido.css">
<link rel="stylesheet" href="tema-claro.css">
<script src="tema.js"></script>
<style>
  body { overflow: hidden; }
  [hidden] { display: none !important; }
  .capa { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; padding: 14px 24px 18px; box-sizing: border-box; gap: 12px; }
  nav { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 18px; }
  nav a.atras { color: var(--suave); text-decoration: none; font-size: 14px; } nav a.atras:hover { color: var(--texto); }
  #nombre { flex: 1; max-width: 340px; padding: 8px 16px; border-radius: 999px; border: .8px solid var(--borde); background: rgba(255,255,255,.06); color: var(--texto); font: 500 16px Geist, system-ui; outline: none; }
  #nombre:focus { border-color: var(--rojo); }
  nav .grande { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .btn.chico { padding: 8px 16px; font-size: 13px; }
  #estado { color: var(--suave); font-size: 12px; min-width: 90px; text-align: right; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; }
  .izq { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  #marco { position: relative; width: min(100%, calc((100vh - 150px) * 16 / 9)); aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #0a0709; box-shadow: 0 16px 50px rgba(0,0,0,.5), 0 0 0 1px var(--borde); touch-action: none; user-select: none; }
  #vista { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; border: 0; transform-origin: 0 0; pointer-events: none; }
  #capa { position: absolute; inset: 0; }
  .rz { position: absolute; border: 1.5px solid var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); cursor: move; box-sizing: border-box; border-radius: 3px; }
  .rz.sel { border-width: 2.5px; background: color-mix(in srgb, var(--c) 22%, transparent); box-shadow: 0 0 0 1px #000, 0 0 16px var(--c); }
  .guia { position: absolute; background: #ff3fd8; box-shadow: 0 0 6px #ff3fd8; pointer-events: none; z-index: 999; }
  .rz span { position: absolute; left: 3px; top: 1px; font: 10px "Geist Mono", monospace; color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: nowrap; }
  .rz .hd { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; background: var(--c); cursor: nwse-resize; border-radius: 3px 0 3px 0; }
  .ayuda { color: var(--suave); font-size: 13px; }
  .der { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scrollbar-width: thin; }
  .sec { display: flex; flex-direction: column; gap: 8px; }
  .sec .mono { color: var(--suave); }
  .regla { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.07); border: .8px solid var(--borde); font-size: 13px; line-height: 1.45; color: var(--suave); }
  .regla b { color: var(--texto); font-weight: 600; }
  label.f { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--suave); }
  label.f.off { opacity: .4; pointer-events: none; }
  select, input[type=color] { background: rgba(255,255,255,.07); color: var(--texto); border: .8px solid var(--borde); border-radius: 10px; padding: 6px 10px; font: 13px Geist, system-ui; max-width: 190px; }
  select option { background: #1a1214; color: #fff; } select option:disabled { color: #777; }
  input[type=color] { width: 44px; height: 30px; padding: 2px; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--rojo); width: 16px; height: 16px; }
  .rng { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--suave); }
  .rng .fila-h { justify-content: space-between; } .rng b { color: var(--texto); font-weight: 500; font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 999px; background: rgba(255,255,255,.14); margin: 6px 0; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px var(--rojo); }
  .pieza { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 12px; border: .8px solid var(--borde); background: rgba(255,255,255,.04); cursor: pointer; font-size: 13px; }
  .pieza.sel { border-color: var(--texto); background: rgba(255,255,255,.12); }
  .pieza i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
  .pieza span { flex: 1; }
  .mini { background: none; border: none; color: var(--suave); cursor: pointer; font-size: 15px; padding: 2px 5px; } .mini:hover { color: var(--texto); } .mini[disabled] { opacity: .35; cursor: default; }
  .boton { background: none; border: .8px solid var(--borde); color: var(--texto); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: 13px Geist, system-ui; } .boton:hover { border-color: var(--texto); }
  .detalle { padding: 12px; border-radius: 14px; border: .8px dashed var(--borde); display: flex; flex-direction: column; gap: 8px; }
  .fila-h { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="liquido" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.006 0.009" numOctaves="2" seed="11" result="ruido"/>
  <feGaussianBlur in="ruido" stdDeviation="2.5" result="suave"/>
  <feDisplacementMap in="SourceGraphic" in2="suave" scale="70" xChannelSelector="R" yChannelSelector="G"/>
</filter></svg>
<canvas id="haz"></canvas>
<div class="capa">
  <nav class="vidrio pastilla">
    <a class="atras" href="index.html">← Biblioteca</a>
    <input id="nombre" type="text" maxlength="40" spellcheck="false" aria-label="Nombre de la plantilla">
    <span class="grande"><span id="estado"></span>
      <button class="btn vidrio pastilla chico" id="exportar">Exportar</button>
      <button class="btn vidrio pastilla chico" id="duplicar">Duplicar</button>
      <button class="btn vidrio pastilla chico" id="eliminar">Eliminar</button>
      <button class="btn btn-principal chico" id="usar">Usar esta</button></span>
  </nav>
  <main>
    <div class="izq">
      <div id="marco"><iframe id="vista" title="Vista previa" tabindex="-1"></iframe><div id="capa"></div></div>
      <div class="ayuda">Arrastra un recuadro para moverlo y estíralo desde su esquina. Cada pieza se ve como quedará, con música de ejemplo.</div>
    </div>
    <aside class="der vidrio tarjeta" id="panel"></aside>
  </main>
</div>
<script src="agujero.js"></script>
<script src="fondo-app.js"></script>
<script src="esquema.js"></script>
<script src="plantillas-propias.js"></script>
<script>
"use strict";
fondoApp();   // la galaxia desenfocada (fondo-app.js)
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
let spec = Propias.obtener(q.get("id"));
if (!spec) { spec = Propias.nueva(q.get("base") || "central"); history.replaceState(null, "", `editor.html?id=${spec.id}`); }
const COLOR = { visual: "#4da3ff", caratula: "#b36bff", titulo: "#ffd23d", artista: "#ffd23d", botones: "#ff7a45", barra: "#3ddc84", tiempo: "#8fe3ff", volumen: "#3ddc84", lista: "#ff4da6", panel: "#9aa4b8", imagen: "#ff9a2a", cabeza: "#ff4da6", equipo: "#4da3ff" };
const T = ESQUEMA.tipos;
let sel = 0, recarga = 0, aviso = 0;
const api = () => window.pywebview.api;
const estado = (t) => { $("estado").textContent = t; clearTimeout(aviso); aviso = setTimeout(() => { $("estado").textContent = ""; }, 2500); };

function guardar(recargar = true) { Propias.guardar(spec); estado("Guardado"); if (recargar) refrescar(); }
function refrescar(rapido) {
  clearTimeout(recarga);
  recarga = setTimeout(() => { $("vista").src = `libre.html?plantilla=${spec.id}&fuente=demo&r=${Date.now()}`; }, rapido ? 0 : 250);
}
new ResizeObserver(() => { $("vista").style.transform = `scale(${$("marco").clientWidth / 1440})`; }).observe($("marco"));

// ---- Recuadros sobre la vista previa ----
function pintarCapa() {
  const capa = $("capa"); capa.innerHTML = "";
  spec.piezas.forEach((p, i) => {
    const e = document.createElement("div"); e.className = "rz" + (i === sel ? " sel" : ""); e.dataset.i = i; e.style.setProperty("--c", COLOR[p.tipo]);
    e.style.cssText += `;left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%;z-index:${i + 1}`;
    e.innerHTML = `<span>${T[p.tipo].etiqueta}</span><div class="hd"></div>`; capa.appendChild(e);
  });
}
const limitar = (n, a, b) => Math.max(a, Math.min(b, n));
let arrastre = null;
$("capa").addEventListener("pointerdown", (e) => {
  const r = e.target.closest(".rz"); if (!r) return;
  const i = +r.dataset.i; sel = i;
  arrastre = { i, tam: e.target.classList.contains("hd"), x: e.clientX, y: e.clientY, z: { ...spec.piezas[i] }, movido: false };
  $("capa").setPointerCapture(e.pointerId); e.preventDefault(); pintarCapa(); pintarPanel();
});
$("capa").addEventListener("pointermove", (e) => {
  if (!arrastre) return;
  const b = $("capa").getBoundingClientRect(), dx = (e.clientX - arrastre.x) / b.width * 100, dy = (e.clientY - arrastre.y) / b.height * 100, p = spec.piezas[arrastre.i], z = arrastre.z;
  if (Math.abs(dx) + Math.abs(dy) > 0.2) arrastre.movido = true;
  if (arrastre.tam) { p.w = Math.round(limitar(z.w + dx, 3, 100 - z.x) * 10) / 10; p.h = Math.round(limitar(z.h + dy, 1.5, 100 - z.y) * 10) / 10; }
  else { p.x = Math.round(limitar(z.x + dx, 0, 100 - z.w) * 10) / 10; p.y = Math.round(limitar(z.y + dy, 0, 100 - z.h) * 10) / 10; }
  iman(p, arrastre.tam, e.altKey);
  const r = $("capa").querySelector(`[data-i="${arrastre.i}"]`); Object.assign(r.style, { left: p.x + "%", top: p.y + "%", width: p.w + "%", height: p.h + "%" });
});
$("capa").addEventListener("pointerup", () => { if (arrastre && arrastre.movido) guardar(); arrastre = null; guias([], []); });
// Imán: al acercar un borde o el centro de la pieza a los de otra (o al centro de la pantalla) se pega y aparece una guía. Alt lo desactiva.
function iman(p, tam, apagado) {
  if (apagado) return guias([], []);
  const otras = spec.piezas.filter(q => q !== p), U = 0.8;
  const lineas = (eje) => [0, 50, 100, ...otras.flatMap(q => eje === "x" ? [q.x, q.x + q.w / 2, q.x + q.w] : [q.y, q.y + q.h / 2, q.y + q.h])];
  const pegar = (eje) => {
    const a = eje === "x" ? p.x : p.y, l = eje === "x" ? p.w : p.h, mios = tam ? [a + l] : [a, a + l / 2, a + l];
    let mejor = null;
    for (const m of mios) for (const o of lineas(eje)) { const d = o - m; if (Math.abs(d) <= U && (!mejor || Math.abs(d) < Math.abs(mejor.d))) mejor = { d, o }; }
    if (!mejor) return [];
    if (tam) { if (eje === "x") p.w = Math.round((p.w + mejor.d) * 10) / 10; else p.h = Math.round((p.h + mejor.d) * 10) / 10; }
    else if (eje === "x") p.x = Math.round(limitar(p.x + mejor.d, 0, 100 - p.w) * 10) / 10; else p.y = Math.round(limitar(p.y + mejor.d, 0, 100 - p.h) * 10) / 10;
    return [mejor.o];
  };
  guias(pegar("x"), pegar("y"));
}
function guias(xs, ys) {
  $("capa").querySelectorAll(".guia").forEach(g => g.remove());
  xs.forEach(x => { const g = document.createElement("div"); g.className = "guia"; g.style.cssText = `left:${x}%;top:0;bottom:0;width:1px`; $("capa").appendChild(g); });
  ys.forEach(y => { const g = document.createElement("div"); g.className = "guia"; g.style.cssText = `top:${y}%;left:0;right:0;height:1px`; $("capa").appendChild(g); });
}

// ---- Controles generados desde el esquema (enum, num, bool, color) ----
const opciones = (obj, actual) => Object.entries(obj).map(([k, v]) => `<option value="${k}"${k === actual ? " selected" : ""}>${v}</option>`).join("");
function control(def, valor, alCambiar, apagado) {
  const d = document.createElement("div");
  if (def.t === "enum") {
    d.innerHTML = `<label class="f${apagado ? " off" : ""}">${def.n}<select>${opciones(def.v, valor)}</select></label>`;
    d.querySelector("select").onchange = (e) => alCambiar(e.target.value);
  } else if (def.t === "num") {
    d.className = "rng" + (apagado ? " off" : ""); d.innerHTML = `<div class="fila-h"><span>${def.n}</span><b>${valor}${def.u || ""}</b></div><input type="range" min="${def.min}" max="${def.max}" step="1" value="${valor}">`;
    const r = d.querySelector("input"); r.oninput = () => { d.querySelector("b").textContent = r.value + (def.u || ""); alCambiar(+r.value, true); };
  } else if (def.t === "bool") {
    d.innerHTML = `<label class="f${apagado ? " off" : ""}">${def.n}<input type="checkbox"${valor ? " checked" : ""}></label>`;
    d.querySelector("input").onchange = (e) => alCambiar(e.target.checked);
  } else if (def.t === "color") {
    d.innerHTML = `<label class="f${apagado ? " off" : ""}">${def.n}<span class="fila-h"><input type="color" value="${valor || "#ffffff"}">${def.vacio ? `<button class="boton" type="button">${valor ? "Quitar" : "Acento"}</button>` : ""}</span></label>`;
    d.querySelector("input").oninput = (e) => alCambiar(e.target.value, true);
    const b = d.querySelector("button"); if (b) b.onclick = () => alCambiar("");
  }
  return d;
}
const actual = (obj, k, def) => obj[k] === undefined || obj[k] === null ? def.def : obj[k];

function pintarPanel() {
  const P = $("panel"), p = spec.piezas[sel], reglas = Propias.reglas(spec);
  P.innerHTML = "";
  const sec = (titulo) => { const s = document.createElement("div"); s.className = "sec"; if (titulo) s.innerHTML = `<div class="mono">${titulo}</div>`; P.appendChild(s); return s; };
  const nota = (spec.base && reglas) ? `<div class="regla"><b>Basada en ${Propias.INCLUIDAS[spec.base].nombre}.</b> ${reglas.nota}</div>` : '<div class="regla">Plantilla libre: agrega las piezas que quieras. Cada pieza cumple una función (título, botones…) y no puede repetirse.</div>';
  P.insertAdjacentHTML("beforeend", nota);

  // Fondo
  const f = sec("Fondo");
  f.appendChild(Object.assign(document.createElement("div"), { innerHTML: `<label class="f">Tipo<select>${opciones(ESQUEMA.fondos, spec.fondo.tipo)}</select></label>` }));
  f.querySelector("select").onchange = (e) => { spec.fondo.tipo = e.target.value; guardar(); pintarPanel(); };
  const t = spec.fondo.tipo, fd = ESQUEMA.fondo;
  const relevantes = { color: ["color"], degradado: ["color", "color2", "angulo"], imagen: ["color"], caratula: ["color", "desenfoque"], haz: ["color"], tunel: ["color"], burbujas: ["color"], luces: ["color"], estrellas: ["color"], ascii: ["tema", "eventos", "imagenModo", "imagenAjuste", "imagenColor", "imagenSola"] }[t] || [];
  relevantes.forEach(k => f.appendChild(control(fd[k], actual(spec.fondo, k, fd[k]), (v, vivo) => { spec.fondo[k] = v; guardar(false); refrescar(vivo ? false : true); if (!vivo) pintarPanel(); })));
  if (t === "imagen" || t === "ascii") { const b = document.createElement("div"); b.className = "fila-h"; b.innerHTML = `<button class="boton">${spec.fondo.imagen ? "Cambiar imagen…" : t === "ascii" ? "Elegir tu imagen (se vuelve ASCII)…" : "Elegir imagen…"}</button>`; b.firstChild.onclick = async () => { const r = await api().imagen_elegir(spec.id, "fondo", false); if (!r.ok) return estado(r.error); if (r.cancelado) return; spec.fondo.imagen = r.url; guardar(); pintarPanel(); }; f.appendChild(b); }
  f.appendChild(control(fd.brillo, actual(spec.fondo, "brillo", fd.brillo), (v) => { spec.fondo.brillo = v; guardar(false); refrescar(); }));

  // Estilo
  const e = sec("Estilo"), ed = ESQUEMA.estilo;
  Object.keys(ed).forEach(k => e.appendChild(control(ed[k], actual(spec.estilo, k, ed[k]), (v, vivo) => { spec.estilo[k] = v; guardar(false); refrescar(); if (!vivo) pintarPanel(); }, k === "acento" && spec.estilo.acentoAuto)));

  // Piezas
  const pz = sec("Piezas (la de arriba va delante)"), L = document.createElement("div"); L.style.cssText = "display:flex;flex-direction:column;gap:6px"; pz.appendChild(L);
  [...spec.piezas.keys()].reverse().forEach(i => {
    const x = spec.piezas[i], row = document.createElement("div"); row.className = "pieza" + (i === sel ? " sel" : ""); row.style.setProperty("--c", COLOR[x.tipo]);
    const extra = x.tipo === "visual" ? " · " + ESQUEMA.tipos.visual.opciones.visual.v[actual(x, "visual", ESQUEMA.tipos.visual.opciones.visual)] : "";
    row.innerHTML = `<i></i><span>${T[x.tipo].etiqueta}${extra}</span>`;
    const b = (txt, tit, fn, off) => { const m = document.createElement("button"); m.className = "mini"; m.textContent = txt; m.title = tit; m.disabled = !!off; m.onclick = (ev) => { ev.stopPropagation(); fn(); }; row.appendChild(m); };
    b("▲", "Traer adelante", () => mover(i, 1)); b("▼", "Enviar atrás", () => mover(i, -1));
    const req = Propias.esRequerida(spec, i); b(req ? "🔒" : "✕", req ? "Esta plantilla base la necesita" : "Quitar esta pieza", () => quitar(i), req);
    row.onclick = () => { sel = i; pintarCapa(); pintarPanel(); }; L.appendChild(row);
  });
  const ag = document.createElement("div"); ag.className = "fila-h";
  ag.innerHTML = `<select id="aTipo">${Object.entries(T).map(([k, d]) => { const ok = Propias.puedeAgregar(spec, k); return `<option value="${k}"${ok ? "" : " disabled"}>${d.etiqueta}${ok ? "" : " — " + Propias.motivoNo(spec, k)}</option>`; }).join("")}</select><button class="boton" id="aAgregar">Agregar</button>`;
  pz.appendChild(ag);
  const primero = [...ag.querySelector("select").options].find(o => !o.disabled); if (primero) ag.querySelector("select").value = primero.value;
  ag.querySelector("button").onclick = () => { const k = ag.querySelector("select").value; if (!Propias.puedeAgregar(spec, k)) return; spec.piezas.push(Propias.pieza(k, spec.piezas.map(z => z.n))); sel = spec.piezas.length - 1; guardar(); pintarCapa(); pintarPanel(); };

  // Detalle de la pieza elegida: todas sus opciones salen del esquema
  if (p) {
    const d = sec(`${T[p.tipo].etiqueta}: opciones`); d.className = "sec detalle"; d.insertAdjacentHTML("afterbegin", "");
    const defs = { ...T[p.tipo].opciones, ...ESQUEMA.comunes };
    Object.entries(defs).forEach(([k, def]) => {
      if (def.t === "imagen") {
        const b = document.createElement("div"); b.className = "fila-h"; b.innerHTML = `<button class="boton">${p.imagen ? "Cambiar imagen…" : "Elegir imagen…"}</button>`;
        b.firstChild.onclick = async () => { const r = await api().imagen_elegir(spec.id, p.n, true); if (!r.ok) return estado(r.error); if (r.cancelado) return; p.imagen = r.url; guardar(); pintarPanel(); }; d.appendChild(b);
        if (p.imagen && !p.imagen.startsWith("img/")) {   // quitar el fondo con IA, en este PC (recorte.py)
          const q = document.createElement("div"); q.className = "fila-h"; q.innerHTML = '<button class="boton">Quitar fondo</button>';
          q.firstChild.onclick = async () => { q.firstChild.disabled = true; q.firstChild.textContent = "Quitando el fondo…"; const r = await api().imagen_quitar_fondo(spec.id, p.n);
            q.firstChild.disabled = false; q.firstChild.textContent = "Quitar fondo"; if (!r.ok) return estado(r.error); p.imagen = r.url; guardar(); pintarPanel(); };
          d.appendChild(q);
        } return;
      }
      d.appendChild(control(def, actual(p, k, def), (v, vivo) => { p[k] = v; guardar(false); refrescar(); if (!vivo) pintarPanel(); }));
    });
    if (p.tipo === "cabeza") d.insertAdjacentHTML("beforeend", '<div class="ayuda">El cuerpo «Propio» es el que subes en Biblioteca → Headspace → Cuerpo propio.</div>');
  }

  // Empezar de nuevo (solo plantillas libres: una base incluida mantiene sus reglas)
  if (!spec.base) {
    const b = sec("Empezar de nuevo"), r = document.createElement("div"); r.className = "fila-h";
    r.innerHTML = `<select>${Object.entries(Propias.BASES).map(([k, v]) => `<option value="${k}">${v.nombre}</option>`).join("")}</select><button class="boton">Reemplazar piezas</button>`; b.appendChild(r);
    let seguro = false;
    r.querySelector("button").onclick = (ev) => {
      if (!seguro) { seguro = true; ev.target.textContent = "¿Seguro? Pulsa otra vez"; return; }
      const piezas = []; Propias.BASES[r.querySelector("select").value].piezas.forEach(k => piezas.push(Propias.pieza(k, piezas.map(z => z.n)))); spec.piezas = piezas; sel = 0; guardar(); pintarCapa(); pintarPanel();
    };
  }
}
function mover(i, d) { const j = i + d; if (j < 0 || j >= spec.piezas.length) return; [spec.piezas[i], spec.piezas[j]] = [spec.piezas[j], spec.piezas[i]]; sel = j; guardar(); pintarCapa(); pintarPanel(); }
async function quitar(i) {
  if (Propias.esRequerida(spec, i)) return;
  const x = spec.piezas[i]; if (x.tipo === "imagen" || x.tipo === "carcasa") await api().imagen_quitar(spec.id, x.n);
  spec.piezas.splice(i, 1); sel = Math.max(0, Math.min(sel, spec.piezas.length - 1)); guardar(); pintarCapa(); pintarPanel();
}

// ---- Barra superior ----
$("nombre").value = spec.nombre;
$("nombre").oninput = (e) => { spec.nombre = e.target.value || "Mi plantilla"; guardar(false); };
$("usar").onclick = () => { location.href = `libre.html?plantilla=${spec.id}&fuente=${sessionStorage.getItem("fuente") || "soundcloud"}`; };
$("exportar").onclick = async () => {
  const r = await api().plantilla_exportar(JSON.stringify(spec));
  estado(!r.ok ? r.error : r.cancelado ? "" : "Archivo guardado");
};
$("duplicar").onclick = () => { const c = Propias.duplicar(spec.id); if (c) location.href = `editor.html?id=${c.id}`; };
let seguroBorrar = false;
$("eliminar").onclick = async () => {
  if (!seguroBorrar) { seguroBorrar = true; $("eliminar").textContent = "¿Seguro?"; setTimeout(() => { seguroBorrar = false; $("eliminar").textContent = "Eliminar"; }, 3500); return; }
  const a = api(); await a.imagen_quitar(spec.id, "fondo"); for (const p of spec.piezas) if (p.tipo === "imagen" || p.tipo === "carcasa") await a.imagen_quitar(spec.id, p.n);
  Propias.borrar(spec.id); location.href = "index.html";
};

pintarCapa(); pintarPanel(); refrescar(true);
</script>
</body>
