<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel</title>
<link rel="preload" href="fonts/PixelifySans-400_700-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Silkscreen-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/pixel.css">
<script src="hls.min.js"></script>
<style>
  /* Los colores salen de la paleta elegida (arriba); estos son los de "Sangre". */
  :root { --fondo: #060507; --panel: #1e1b24; --tenue: #8d8580; --texto: #cfc6bd; --acento: #a51218; --brillo: #e8452c; --p: 0%; --v: 80%; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fondo); color: var(--texto);
    font-family: "Pixelify Sans", "Courier New", monospace; }
  .lbl { font-family: "Silkscreen", "Courier New", monospace; text-transform: uppercase; letter-spacing: .08em; }
  /* Esquinas escalonadas de 8-bit, igual que en Music Downloader */
  .px { clip-path: polygon(0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 4px,
    calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px, 100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px),
    calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%, 8px 100%,
    8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px)); }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  #escena { position: fixed; left: 0; top: 0; width: 100%; height: calc(100% - 100px); }
  #app { position: relative; height: 100%; display: grid; grid-template-rows: 44px 1fr 100px; }

  header { display: flex; align-items: center; gap: 8px; padding: 10px 16px 0; flex-wrap: wrap; font-size: 10px; color: var(--tenue); }
  header button { display: flex; align-items: center; gap: 6px; padding: 5px 9px 5px 6px; cursor: pointer; font: inherit;
    color: var(--tenue); background: color-mix(in srgb, var(--panel) 90%, transparent); border: none; }
  header button.elegida { color: var(--fondo); background: var(--brillo); }
  header button i { display: flex; }
  header button i b { width: 6px; height: 10px; }

  main { display: grid; grid-template-columns: 300px 1fr 380px; gap: 20px; padding: 14px 20px 18px; min-height: 0; }
  .panel { background: color-mix(in srgb, var(--panel) 88%, transparent); box-shadow: inset 0 0 0 3px var(--acento); }
  #tarjeta { align-self: start; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  #portada { width: 256px; height: 256px; background: var(--fondo); }
  #tarjeta .lbl { font-size: 10px; color: var(--tenue); }
  #lista { grid-column: 3; overflow-y: auto; padding: 12px 6px; scrollbar-width: thin; scrollbar-color: var(--acento) transparent; }
  .fila { display: grid; grid-template-columns: 34px 26px 1fr 44px; align-items: center; gap: 10px; padding: 5px 12px;
    font-size: 14px; cursor: pointer; color: var(--tenue); }
  .fila:hover { color: var(--texto); background: color-mix(in srgb, var(--acento) 25%, transparent); }
  .fila.sonando { color: var(--fondo); background: var(--brillo); }
  .fila img { width: 34px; height: 34px; object-fit: cover; image-rendering: pixelated; box-shadow: 0 0 0 2px var(--acento); }
  a.volver { font: 10px "Silkscreen", monospace; letter-spacing: .08em; text-transform: uppercase; border: none; border-radius: 0; padding: 8px 12px; opacity: .95;
    color: var(--texto); background: color-mix(in srgb, var(--panel) 92%, transparent);
    clip-path: polygon(0 6px, 3px 6px, 3px 3px, 6px 3px, 6px 0, calc(100% - 6px) 0, calc(100% - 6px) 3px, calc(100% - 3px) 3px, calc(100% - 3px) 6px, 100% 6px, 100% calc(100% - 6px), calc(100% - 3px) calc(100% - 6px), calc(100% - 3px) calc(100% - 3px), calc(100% - 6px) calc(100% - 3px), calc(100% - 6px) 100%, 6px 100%, 6px calc(100% - 3px), 3px calc(100% - 3px), 3px calc(100% - 6px), 0 calc(100% - 6px)); }
  a.volver:hover { color: var(--fondo); background: var(--brillo); }
  .vol { display: flex; align-items: center; gap: 8px; }
  #iconoVol { background: none; border: none; color: var(--tenue); font: 10px "Silkscreen", monospace; cursor: pointer; padding: 0; text-transform: uppercase; }
  #iconoVol:hover { color: var(--texto); }
  .fila .nombre { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fila .n, .fila .dur { font-family: "Silkscreen", monospace; font-size: 10px; }

  footer { display: grid; grid-template-columns: 340px 1fr 240px; align-items: center; gap: 24px; padding: 0 20px;
    background: var(--panel); box-shadow: inset 0 3px 0 var(--acento); }
  .tema { display: flex; gap: 14px; align-items: center; min-width: 0; }
  #mini { width: 64px; height: 64px; flex: none; box-shadow: 0 0 0 3px var(--acento); }
  #titulo { font-size: 18px; font-weight: 700; color: var(--texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #artista { font-size: 13px; color: var(--tenue); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tema > div { min-width: 0; }
  .centro { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .botones { display: flex; gap: 10px; }
  .botones button { font-family: "Silkscreen", monospace; font-size: 14px; width: 54px; height: 38px; cursor: pointer;
    color: var(--texto); background: var(--fondo); border: 3px solid var(--acento); transition: box-shadow .15s, transform .1s; }
  .botones button:hover { color: var(--fondo); background: var(--brillo); border-color: var(--brillo); }
  .botones button:active { transform: scale(.94); }
  #bPlay { width: 70px; }
  /* Barras segmentadas: el relleno avanza con --p / --v */
  input[type=range] { -webkit-appearance: none; appearance: none; height: 14px; margin: 0; cursor: pointer; width: 100%;
    background: repeating-linear-gradient(90deg, transparent 0 8px, var(--panel) 8px 10px),
                linear-gradient(90deg, var(--brillo) var(--p), var(--fondo) var(--p)); box-shadow: 0 0 0 3px var(--acento); }
  #volumen { --p: var(--v); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 20px; background: var(--texto); }
  input[type=range]:disabled { opacity: .35; cursor: default; }
  #barra { max-width: 700px; }
  .derecha { display: flex; flex-direction: column; gap: 12px; }
  #tiempo { font-family: "Silkscreen", monospace; font-size: 11px; color: var(--tenue); text-align: right; }
</style>
</head>
<body>
<canvas id="escena" data-fondo></canvas>
<div id="app">
  <header class="lbl ocultable" id="paletas">Paleta:</header>
  <main>
    <div id="tarjeta" class="panel px">
      <canvas id="portada" width="64" height="64"></canvas>
      <div class="lbl" id="leyenda">Sonando ahora</div>
    </div>
    <div id="lista" class="panel px ocultable" data-prop="lista"></div>
  </main>
  <footer class="ocultable">
    <div class="tema"><canvas id="mini" width="32" height="32"></canvas>
      <div><div id="titulo">—</div><div id="artista"></div></div></div>
    <div class="centro">
      <div class="botones">
        <button id="bAnt" class="px" title="Anterior">&lt;&lt;</button>
        <button id="bPlay" class="px" title="Play / pausa">▶</button>
        <button id="bSig" class="px" title="Siguiente">&gt;&gt;</button>
      </div>
      <input id="barra" type="range" min="0" max="1000" value="0" title="Avance">
    </div>
    <div class="derecha"><div class="vol"><button id="iconoVol" title="Silenciar">Vol</button><input id="volumen" type="range" min="0" max="100" value="80" title="Volumen"></div>
      <div id="tiempo">0:00 / 0:00</div></div>
  </footer>
</div>

<script src="propiedades.js"></script>
<script src="nucleo.js"></script>
<script src="ritmo.js"></script>
<script>const RT = Ritmo.global();   // golpes de bombo, caja y platillo, caída y compás (ritmo.js)</script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
// Cada paleta: fondo, panel, tenue, texto, acento, brillo.
const PALETAS = {
  "Sangre":    ["#060507", "#1e1b24", "#8d8580", "#cfc6bd", "#a51218", "#e8452c"],
  "Game Boy":  ["#0f380f", "#306230", "#a3c426", "#9bbc0f", "#8bac0f", "#9bbc0f"],   // texto inactivo (3.º) más claro que el acento
  "NES":       ["#000000", "#24188c", "#a4a4a4", "#fcfcfc", "#e40058", "#f8b800"],
  "Vaporwave": ["#12062b", "#2d1b4e", "#b39ddb", "#fbeaff", "#ff71ce", "#01cdfe"],
  "Matrix":    ["#000000", "#062b0e", "#1f7a33", "#c8ffd0", "#00b32c", "#39ff6a"],
  "Hielo":     ["#050b14", "#10223a", "#6f8fae", "#e6f6ff", "#3a8dde", "#8fe3ff"],
  "Ámbar":     ["#0b0600", "#2a1700", "#8a5a00", "#ffd27a", "#d98a00", "#ffb000"],
};
{ const c = Props.colorLibre("pixel"); if (c) { const [h] = Props.tonoDe(c), X = (s, l) => Props.aHex(Props.hslARgb(h, s, l)); PALETAS["Propio"] = [X(.5, .04), X(.45, .13), X(.3, .55), X(.6, .92), c, X(.9, .7)]; } }
const CLAVES = ["fondo", "panel", "tenue", "texto", "acento", "brillo"];
const rgb = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const luz = ([r, g, b]) => 0.299 * r + 0.587 * g + 0.114 * b;
let pal = {}, rampa = [], nombreEscena = "Sangre", escenaLista = false;   // la escena de paisaje sigue a la paleta

function usarPaleta(nombre) {
  const c = PALETAS[nombre] || PALETAS.Sangre;
  CLAVES.forEach((k, i) => { pal[k] = rgb(c[i]); document.documentElement.style.setProperty("--" + k, c[i]); });
  // Escalera de oscuro a claro para pintar la carátula solo con colores de la paleta
  rampa = [...new Set(c)].map(rgb).sort((a, b) => luz(a) - luz(b));
  document.querySelectorAll("#paletas button").forEach(b => b.classList.toggle("elegida", b.dataset.p === nombre));
  try { localStorage.setItem("paleta-pixel", nombre); } catch (e) {}
  nombreEscena = nombre; escenaLista = false;
  pintarPortada();
}
for (const [nombre, c] of Object.entries(PALETAS)) {
  const b = document.createElement("button");
  b.className = "px"; b.dataset.p = nombre; b.title = "Paleta " + nombre;
  b.innerHTML = "<i>" + c.slice(1).map(x => `<b style="background:${x}"></b>`).join("") + "</i>";
  b.append(nombre);
  b.onclick = () => usarPaleta(nombre);
  $("paletas").appendChild(b);
}

// ---- Carátula pixelada con tramado (como los juegos de 8 bits) ----
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
let imagen = null;
function pintarPortada() {
  const lienzo = $("portada"), g = lienzo.getContext("2d"), N = lienzo.width;
  g.fillStyle = `rgb(${pal.panel})`; g.fillRect(0, 0, N, N);
  if (imagen) {
    g.drawImage(imagen, 0, 0, N, N);
    try {
      const d = g.getImageData(0, 0, N, N), px = d.data;
      let min = 255, max = 0;
      for (let i = 0; i < px.length; i += 4) { const l = luz([px[i], px[i + 1], px[i + 2]]); if (l < min) min = l; if (l > max) max = l; }
      const k = rampa.length - 1, rango = Math.max(1, max - min);
      for (let i = 0, p = 0; i < px.length; i += 4, p++) {
        const x = p % N, y = (p / N) | 0;
        const l = (luz([px[i], px[i + 1], px[i + 2]]) - min) / rango + (BAYER[(y % 4) * 4 + x % 4] / 16 - 0.5) / k;
        const c = rampa[Math.max(0, Math.min(k, Math.round(l * k)))];
        px[i] = c[0]; px[i + 1] = c[1]; px[i + 2] = c[2];
      }
      g.putImageData(d, 0, 0);
    } catch (e) { /* la imagen no deja leer sus colores: queda pixelada con su color real */ }
  }
  const m = $("mini").getContext("2d");
  m.imageSmoothingEnabled = false;
  m.drawImage(lienzo, 0, 0, 32, 32);
}
function cargarImagen(src, conCors = true) {
  if (!src) { imagen = null; pintarPortada(); return; }
  const img = new Image();
  if (conCors) img.crossOrigin = "anonymous";
  img.onload = () => { imagen = img; pintarPortada(); };
  img.onerror = () => { if (conCors) cargarImagen(src, false); else { imagen = null; pintarPortada(); } };
  img.src = src;
}
R.alCambiar((p) => cargarImagen(p.caratula));

let guardada = "Sangre";
try { guardada = localStorage.getItem("paleta-pixel") || guardada; } catch (e) {}
usarPaleta(PALETAS[guardada] ? guardada : "Sangre");

// ---- Escena: espectro en bloques con topes que caen y estrellas ----
const escena = $("escena"), g = escena.getContext("2d"), ESCALA = Props.extra("pixel", "pixel");
let W = 0, H = 0, topes = [], estrellas = [];
function medir() {
  W = Math.ceil(escena.clientWidth / ESCALA); H = Math.ceil(escena.clientHeight / ESCALA);
  if (!W || !H) return;
  escena.width = W; escena.height = H;
  estrellas = Array.from({ length: Math.round(W * H / 90) }, () => [Math.random() * W, Math.random() * H * 0.7, Math.random()]);
}
addEventListener("resize", medir); medir();
const mezcla = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));

// ---- Paisaje en capas: una escena por paleta. Tres planos que avanzan a distinta velocidad (más rápido con el bajo), un astro que late, y detalles propios ----
const ESCENAS = {
  "Sangre":    { perfil: "bosque",   astro: "luna", astroCol: "brillo", niebla: true },
  "Game Boy":  { perfil: "colinas",  astro: "sol",  astroCol: "brillo", nubes: true },
  "NES":       { perfil: "ciudad" },
  "Vaporwave": { perfil: "montanas", astro: "solrayas", rejilla: true },
  "Matrix":    { lluvia: true },
  "Hielo":     { perfil: "montanas", astro: "luna", astroCol: "texto", nieve: true, cimas: true },
  "Ámbar":     { perfil: "dunas",    astro: "sol",  astroCol: "brillo" },
  "Propio":    { perfil: "colinas",  astro: "luna", astroCol: "texto" },
};
const LW = 768, TAU = Math.PI * 2;
let capas = [], gotas = [], copos = [], nubes = [], fase = [0, 0, 0], tPrev = 0, esc = ESCENAS.Sangre;
const azar = (sem) => { let q = sem >>> 0; return () => (q = (Math.imul(q, 1664525) + 1013904223) >>> 0) / 4294967296; };
const mod = (a, n) => ((a % n) + n) % n;
function perfilDe(tipo, R, k) {   // alturas de 0 a 1 en LW columnas (se repite sin corte); k = plano (0 lejos, 2 cerca)
  const p = new Float32Array(LW);
  if (tipo === "colinas" || tipo === "dunas") {
    const f1 = tipo === "dunas" ? 2 + k : 3 + k * 2, f2 = f1 * 2 + 1, a = R() * TAU, b = R() * TAU;
    for (let x = 0; x < LW; x++) p[x] = .5 + (tipo === "dunas" ? .34 : .3) * Math.sin(f1 * TAU * x / LW + a) + .16 * Math.sin(f2 * TAU * x / LW + b);
  } else if (tipo === "montanas") {
    for (let n = 0; n < 5 + k * 2; n++) {
      const cx = R() * LW, ht = .45 + .5 * R(), ancho = 40 + R() * 70;
      for (let dx = -ancho; dx <= ancho; dx++) { const i = mod(Math.round(cx + dx), LW); p[i] = Math.max(p[i], ht * (1 - Math.abs(dx) / ancho)); }
    }
  } else if (tipo === "bosque") {
    for (let n = 0; n < 38 + k * 22; n++) {
      const cx = R() * LW, ht = .3 + .55 * R(), ancho = 4 + ht * 9;
      for (let dx = -ancho; dx <= ancho; dx++) { const i = mod(Math.round(cx + dx), LW); p[i] = Math.max(p[i], ht * (1 - Math.abs(dx) / ancho) * .95 + .04); }
    }
  } else if (tipo === "ciudad") {
    for (let x = 0; x < LW;) { const w = 8 + Math.floor(R() * 18), h = (.2 + .7 * R()) * (k ? 1 : .8); for (let i = 0; i < w && x + i < LW; i++) p[x + i] = h; x += w + (R() < .25 ? 2 : 0); }
  }
  for (let x = 0; x < LW; x++) p[x] = Math.round(p[x] * 36) / 36;   // alturas en escalones: se ve a píxeles
  return p;
}
function generarEscena() {
  const R = azar(7 + [...nombreEscena].reduce((a, c) => a + c.charCodeAt(0), 0)); esc = ESCENAS[nombreEscena] || ESCENAS.Propio;
  capas = esc.perfil ? [0, 1, 2].map(k => ({ p: perfilDe(esc.perfil, R, k), vel: [5, 11, 22][k], base: [.6, .68, .77][k], alto: [.3, .28, .3][k], mezcla: [.14, .28, .46][k] })) : [];
  if (esc.perfil === "ciudad") capas = capas.slice(1);
  gotas = Array.from({ length: Math.floor(W / 3) }, () => ({ y: R() * H, v: 30 + R() * 70, l: 6 + Math.floor(R() * 12) }));
  copos = Array.from({ length: Math.round(W * H / 420) }, () => [R() * W, R() * H, 8 + R() * 22, R() * TAU]);
  nubes = Array.from({ length: 5 }, () => ({ x: R() * W, y: H * (.08 + R() * .26), w: 14 + R() * 20, v: 1.5 + R() * 3 }));
  escenaLista = true;
}
const col = (c) => `rgb(${c})`;
function paisaje(t, bajo) {
  const dt = Math.min(.1, t - tPrev || .016); tPrev = t; const caida = Math.max(0, 1 - RT.desdeCaida / .7);
  if (!escenaLista) generarEscena();
  const lluvia = !!esc.lluvia, horizonte = H * (esc.rejilla ? .66 : .72);
  // cielo en bandas (degradado a píxeles) y estrellas
  if (lluvia) { g.fillStyle = col(pal.fondo); g.fillRect(0, 0, W, H); }
  else for (let i = 0; i < 6; i++) { g.fillStyle = col(mezcla(pal.fondo, pal.panel, (i / 5) * .8)); const y0 = Math.floor(horizonte * i / 6), y1 = Math.floor(horizonte * (i + 1) / 6); g.fillRect(0, y0, W, y1 - y0 + 1); }
  if (!lluvia) { g.fillStyle = col(pal.fondo); g.fillRect(0, horizonte, W, H - horizonte); }
  g.fillStyle = col(pal.tenue);
  for (const e of estrellas) {
    e[0] -= (.05 + e[2] * .25) * (1 + bajo * 6); if (e[0] < 0) e[0] += W;
    if (e[1] < horizonte * .8 && ((t * 3 + e[2] * 10) % 4 > .6 || (RT.platillo > .3 && e[2] > .55))) g.fillRect(e[0] | 0, e[1] | 0, 1, 1);   // platillos: titilan más estrellas
  }
  if (!lluvia && (RT.caja > .05 || caida > .05)) { g.globalAlpha = Math.min(.55, RT.caja * .16 + caida * .45); g.fillStyle = col(mezcla(pal.fondo, pal.brillo, .55)); g.fillRect(0, 0, W, horizonte); g.globalAlpha = 1; }   // caja: relámpago en el cielo
  // astro: late con cada golpe
  if (esc.astro) {
    const cx = W * .47, cy = H * .26, Rr = H * .1 * (1 + bajo * .2 + RT.bombo * .22), c0 = esc.astro === "solrayas" ? pal.brillo : pal[esc.astroCol || "texto"];
    g.fillStyle = col(mezcla(pal.fondo, c0, .16)); for (let dy = -Rr * 1.5; dy <= Rr * 1.5; dy++) { const hw = Math.sqrt(Math.max(0, Rr * Rr * 2.25 - dy * dy)) | 0; g.fillRect(cx - hw, (cy + dy) | 0, hw * 2, 1); }
    for (let dy = -Rr; dy <= Rr; dy++) {
      if (esc.astro === "solrayas" && dy > 0 && Math.floor(dy) % 6 < Math.min(5, dy / Rr * 7)) continue;   // franjas del sol Vaporwave
      g.fillStyle = col(esc.astro === "solrayas" ? mezcla(pal.brillo, pal.acento, (dy + Rr) / (2 * Rr)) : c0);
      const hw = Math.sqrt(Rr * Rr - dy * dy) | 0; g.fillRect(cx - hw, (cy + dy) | 0, hw * 2, 1);
    }
  }
  if (esc.nubes) { g.fillStyle = col(mezcla(pal.fondo, pal.tenue, .55)); for (const n of nubes) { n.x -= n.v * dt * (1 + bajo * 2); if (n.x < -n.w) n.x = W + 4; g.fillRect(n.x | 0, n.y | 0, n.w | 0, 3); g.fillRect((n.x + 4) | 0, (n.y - 2) | 0, (n.w - 9) | 0, 2); } }
  // los tres planos
  capas.forEach((c, k) => {
    fase[k] = (fase[k] + c.vel * dt * (1 + bajo * 2.2 + RT.bombo * 2.6)) % LW;   // bombo: el paisaje se lanza hacia adelante
    const base = H * c.base, fondoCol = col(mezcla(pal.fondo, pal.acento, c.mezcla));
    for (let x = 0; x < W; x++) {
      const i = mod(Math.floor(x + fase[k]), LW), h = Math.round(c.p[i] * H * c.alto), y = base - h;
      g.fillStyle = fondoCol; g.fillRect(x, y, 1, H - y);
      if (esc.cimas && k > 0 && h > H * .12) { g.fillStyle = col(mezcla(pal.fondo, pal.texto, .8)); g.fillRect(x, y, 1, 2); }
    }
    if (esc.perfil === "ciudad" && k === capas.length - 1) {   // ventanas: se encienden más con el bajo
      for (let x = 1; x < W; x += 4) {
        const i = mod(Math.floor(x + fase[k]), LW), h = Math.round(c.p[i] * H * c.alto);
        for (let y = base - h + 3; y < base - 3; y += 5) { const q = (Math.imul(mod(Math.floor(x + fase[k]), LW) * 31 + y, 2654435761) >>> 0) % 100; if (q < 35 + bajo * 55 + RT.caja * 45) {   // caja: se encienden más ventanas
         g.fillStyle = col(q % 3 ? pal.brillo : pal.texto); g.fillRect(x, y, 2, 2); } }
      }
    }
  });
  if (esc.niebla) { g.globalAlpha = .1 + bajo * .07; g.fillStyle = col(pal.tenue); for (let k = 0; k < 3; k++) g.fillRect(0, horizonte - 6 + k * 7 + Math.sin(t * .5 + k) * 2, W, 4); g.globalAlpha = 1; }
  if (esc.rejilla) {   // suelo con rejilla en perspectiva que avanza hacia ti
    g.strokeStyle = col(mezcla(pal.fondo, pal.acento, .75)); g.lineWidth = 1; g.beginPath();
    for (let j = -14; j <= 14; j++) { g.moveTo(W / 2 + j * 7, horizonte); g.lineTo(W / 2 + j * W / 5, H); }
    const f = (t * (.35 + bajo * .9 + RT.bombo * 1.4)) % 1;
    for (let i = 0; i < 12; i++) { const z = (i + f) / 12, y = horizonte + (H - horizonte) * z * z; g.moveTo(0, y | 0); g.lineTo(W, y | 0); }
    g.stroke();
  }
  if (lluvia) {   // lluvia digital: cada columna deja una estela que se apaga
    for (let i = 0; i < gotas.length; i++) {
      const d = gotas[i]; d.y += d.v * dt * (1 + bajo * 3 + RT.caja * 3); if (d.y - d.l * 3 > H) { d.y = -Math.random() * 40; d.v = 30 + Math.random() * 70; }
      for (let k = 0; k < d.l; k++) { g.fillStyle = col(k === 0 ? pal.texto : mezcla(pal.fondo, pal.brillo, (1 - k / d.l) * .9)); g.fillRect(i * 3, (d.y - k * 3) | 0, 2, 2); }
    }
  }
  // nieve: el bombo trae ráfagas de viento
  if (esc.nieve) { g.fillStyle = col(pal.texto); for (const c of copos) { c[1] += c[2] * dt * (1 + bajo * 1.5); c[0] += Math.sin(t * .8 + c[3]) * .25 + RT.bombo * 1.6; if (c[1] > H) { c[1] = -2; c[0] = Math.random() * W; } g.fillRect(c[0] | 0, c[1] | 0, 1, 1); } }
}

R.cadaCuadro((t) => {
  document.documentElement.style.setProperty("--p", (R.progreso() * 100).toFixed(2) + "%");
  if (!W || !H) return medir();
  const d = R.espectro(), bajo = R.energia(d, 1, 8);
  paisaje(t, bajo);
  // Barras: columnas de 4 px y bloques de 3 px, de frecuencias bajas a altas (escala logarítmica)
  const cols = Math.floor(W / 5), alto = H * 0.28, filas = Math.floor(alto / 4);   // barras bajas: no tapan el paisaje
  if (topes.length !== cols) topes = new Array(cols).fill(0);
  for (let c = 0; c < cols; c++) {
    const i0 = Math.floor(2 * Math.pow(160, c / cols)), i1 = Math.max(i0 + 1, Math.floor(2 * Math.pow(160, (c + 1) / cols)));
    const v = R.energia(d, i0, i1);
    const n = Math.round(Math.pow(v, 2.8) * filas);   // curva fuerte: con temas muy fuertes no se llena todo
    topes[c] = Math.max(n, topes[c] - 0.25);
    const x = c * 5 + ((W - cols * 5) >> 1);
    for (let f = 0; f < n; f++) {
      g.fillStyle = `rgb(${mezcla(pal.acento, pal.brillo, f / filas)})`;
      g.fillRect(x, H - 4 - f * 4, 4, 3);
    }
    g.fillStyle = `rgb(${pal.texto})`;
    g.fillRect(x, H - 4 - Math.ceil(topes[c]) * 4, 4, 1);
  }
});
$("volumen").addEventListener("input", (e) => document.documentElement.style.setProperty("--v", e.target.value + "%"));
</script>
</body>
