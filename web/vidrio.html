<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidrio — prototipo</title>
<script src="hls.min.js"></script>
<style>
  :root { --texto: #f1ecf7; --suave: rgba(241,236,247,.65); --vidrio: rgba(20,14,34,.42); --borde: rgba(255,255,255,.12); --acento: #6d9cff; }
  html, body { margin: 0; height: 100%; background: #140e22; color: var(--texto);
    font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  /* La carátula desenfocada de fondo: late con el bajo */
  #fondo { position: fixed; inset: -10%; background-size: cover; background-position: center;
    filter: blur(48px) saturate(1.4) brightness(.6); transform: scale(1.15); transition: background-image .6s; }
  #velo { position: fixed; inset: 0; background: linear-gradient(180deg, rgba(10,6,20,.25), rgba(10,6,20,.65)); }
  #app { position: relative; height: 100%; display: grid; grid-template-rows: 1fr 92px; }
  main { display: grid; grid-template-columns: minmax(0, 44%) 1fr; gap: 24px; padding: 28px 28px 18px; min-height: 0; }
  #arte { display: flex; align-items: center; justify-content: center; min-height: 0; }
  #grande { max-width: 100%; max-height: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px;
    box-shadow: 0 25px 60px rgba(0,0,0,.55), 0 0 0 1px var(--borde); }
  #lista { overflow-y: auto; background: var(--vidrio); border: 1px solid var(--borde); border-radius: 12px;
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); padding: 10px 0; }
  .fila { display: grid; grid-template-columns: 42px 30px 1fr 50px; align-items: center; gap: 12px;
    padding: 6px 18px; font-size: 13px; cursor: pointer; color: var(--suave); }
  .fila:hover { background: rgba(255,255,255,.06); }
  .fila.sonando { color: #fff; background: rgba(109,156,255,.18); }
  .fila img { width: 42px; height: 42px; object-fit: cover; border-radius: 4px; }
  .fila .nombre { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fila .dur, .fila .n { font-variant-numeric: tabular-nums; }
  footer { display: grid; grid-template-columns: 260px 1fr 200px; align-items: center; gap: 24px; padding: 0 28px;
    background: var(--vidrio); border-top: 1px solid var(--borde); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); }
  #titulo { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #artista { color: var(--suave); font-size: 13px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .centro { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .botones { display: flex; gap: 26px; align-items: center; }
  .botones button { background: none; border: none; color: var(--texto); font-size: 19px; cursor: pointer; }
  #bPlay { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.14); border: 1px solid var(--borde); }
  .linea { display: grid; grid-template-columns: 1fr; width: 100%; max-width: 760px; }
  #barra, #volumen { width: 100%; accent-color: var(--acento); }
  #tiempo { color: var(--suave); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="fondo"></div><div id="velo"></div>
<div id="app">
  <main>
    <div id="arte"><img id="grande" alt=""></div>
    <div id="lista"></div>
  </main>
  <footer>
    <div><div id="titulo">—</div><div id="artista"></div></div>
    <div class="centro">
      <div class="botones">
        <button id="bAnt" title="Anterior">⏮</button>
        <button id="bPlay" title="Play / pausa">▶</button>
        <button id="bSig" title="Siguiente">⏭</button>
      </div>
      <div class="linea"><input id="barra" type="range" min="0" max="1000" value="0"></div>
    </div>
    <div><input id="volumen" type="range" min="0" max="100" value="80" title="Volumen"><div id="tiempo">0:00 / 0:00</div></div>
  </footer>
</div>

<script src="nucleo.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
R.alCambiar((p) => {
  $("grande").src = p.caratula || "";
  $("fondo").style.backgroundImage = p.caratula ? `url("${p.caratula}")` : "none";
});
let suave = 0;
R.cadaCuadro(() => {
  const bajo = R.energia(R.espectro(), 1, 8);
  suave += (bajo - suave) * 0.25;
  $("fondo").style.transform = `scale(${(1.15 + suave * 0.12).toFixed(3)})`;
  $("grande").style.transform = `scale(${(1 + suave * 0.025).toFixed(3)})`;
});
</script>
</body>
</html>
