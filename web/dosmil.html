<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2000s — prototipo</title>
<script src="hls.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #dfe9ff; overflow: hidden;
    font-family: Tahoma, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: 1fr 86px; }
  #tunel { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  #visual { position: relative; z-index: 1; width: 100%; height: 100%; display: block; }
  #ahora { z-index: 2; }
  footer { z-index: 2; }
  #ahora { position: fixed; top: 16px; left: 20px; font-size: 13px; text-shadow: 0 1px 2px #000; }
  #ahora b { display: block; font-size: 18px; color: #fff; }
  /* Barra al estilo WMP 10: negro con brillo, cromo y un play redondo grande */
  footer { position: relative; display: grid; grid-template-columns: 70px 1fr auto 1fr; align-items: center; gap: 16px;
    padding: 0 22px; background: linear-gradient(180deg, #4a4f5c 0%, #1b1d24 48%, #050608 52%, #14161c 100%);
    border-top: 1px solid #8a93a6; box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
  #barra { position: absolute; left: 0; right: 0; top: -7px; width: 100%; margin: 0; height: 6px; accent-color: #3fa9ff; }
  #caratula { width: 58px; height: 58px; object-fit: cover; border: 1px solid #8a93a6; border-radius: 3px; }
  .info { min-width: 0; font-size: 12px; }
  #titulo { color: #fff; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #artista, #tiempo { color: #9fb3d6; }
  .botones { display: flex; align-items: center; gap: 10px; }
  .botones button { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; color: #dfe9ff; font-size: 12px;
    border: 1px solid #0b0c10; background: radial-gradient(circle at 50% 28%, #9aa3b6, #3b404c 55%, #15171d);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 1px 3px #000; }
  #bPlay { width: 58px; height: 58px; font-size: 20px; color: #fff;
    background: radial-gradient(circle at 50% 25%, #c9ecff 0%, #3fa9ff 35%, #0b4f9a 75%, #062a55 100%);
    box-shadow: 0 0 18px rgba(63,169,255,.7), inset 0 2px 0 rgba(255,255,255,.6); }
  .derecha { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
  #volumen { width: 120px; accent-color: #3fa9ff; }
</style>
</head>
<body>
<canvas id="tunel"></canvas>
<canvas id="visual"></canvas>
<div id="ahora">Ahora suena<b id="tituloArriba">—</b></div>
<footer>
  <input id="barra" type="range" min="0" max="1000" value="0">
  <img id="caratula" alt="">
  <div class="info"><div id="titulo">—</div><div id="artista"></div><div id="tiempo">0:00 / 0:00</div></div>
  <div class="botones">
    <button id="bStop" title="Detener">■</button>
    <button id="bAnt" title="Anterior">⏮</button>
    <button id="bPlay" title="Play / pausa">▶</button>
    <button id="bSig" title="Siguiente">⏭</button>
  </div>
  <div class="derecha">🔊 <input id="volumen" type="range" min="0" max="100" value="80" title="Volumen"></div>
</footer>

<script src="nucleo.js"></script>
<script src="tunel.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
R.alCambiar((p) => { $("tituloArriba").textContent = p.titulo; });

// "Barras y ondas": barras arriba (con picos) y la onda del sonido abajo, con estela.
const c = $("visual"), g = c.getContext("2d");
const N = 64, picos = new Array(N).fill(0);
R.cadaCuadro((t) => {
  const r = c.getBoundingClientRect();
  if (c.width !== Math.round(r.width) || c.height !== Math.round(r.height)) { c.width = Math.round(r.width); c.height = Math.round(r.height); }
  const w = c.width, h = c.height;
  if (!w || !h) return;
  const d = R.espectro();
  // Detrás: túnel psicodélico; la paleta cambia sola cada 20 s, como los preajustes de WMP.
  const paletas = [PALETAS.arcoiris, PALETAS.oceano, PALETAS.fuego];
  dibujarTunel($("tunel"), d, R.energia(d, 1, 8), R.energia(d, 60, 200), t, paletas[Math.floor(t / 20) % 3]);
  g.clearRect(0, 0, w, h);

  const medio = h * 0.58, ancho = w / N;
  const grad = g.createLinearGradient(0, medio - h * 0.5, 0, medio);
  grad.addColorStop(0, "#ffffff"); grad.addColorStop(0.3, "#7fd4ff"); grad.addColorStop(1, "#0a3cff");
  for (let i = 0; i < N; i++) {
    const v = d[Math.floor(Math.pow(i / N, 1.6) * 260) + 1] / 255;
    picos[i] = Math.max(picos[i] - 0.008, v);
    const alto = v * h * 0.42;
    g.globalAlpha = 0.78;
    g.fillStyle = grad;
    g.fillRect(i * ancho + 2, medio - alto, ancho - 4, alto);
    g.globalAlpha = 1;
    g.fillStyle = "rgba(127, 212, 255, 0.25)";               // reflejo
    g.fillRect(i * ancho + 2, medio + 2, ancho - 4, alto * 0.35);
    g.fillStyle = "#ffffff";
    g.fillRect(i * ancho + 2, medio - picos[i] * h * 0.42 - 4, ancho - 4, 3);
  }

  const o = R.ondaAudio(), base = h * 0.82;
  g.lineWidth = 2;
  g.strokeStyle = `hsl(${(190 + Math.sin(t * 0.5) * 30).toFixed(0)}, 100%, 65%)`;
  g.shadowColor = g.strokeStyle; g.shadowBlur = 12;
  g.beginPath();
  for (let i = 0; i < o.length; i += 2) {
    const x = i / o.length * w, y = base + (o[i] - 128) / 128 * h * 0.12;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.stroke();
  g.shadowBlur = 0;
});
</script>
</body>
</html>
