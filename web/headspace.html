<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Headspace</title>
<link rel="preload" href="fonts/Fredoka-latin-9591efe1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/headspace.css">
<script src="hls.min.js"></script>
<style>
  /* Colores del tono elegido (abajo); estos son los de "Lima". */
  :root { --led: #8dff4a; --gel: #9be22a; --fondo: #123a00; --p: 0%; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Fredoka", "Trebuchet MS", sans-serif; color: #fff; }
  #fondo { position: fixed; inset: 0; width: 100%; height: 100%; }

  /* El cuerpo (imagen) y todo lo de encima se ubica en % de esta caja */
  #cabeza { position: absolute; left: 50%; top: calc(50% - 34px); transform: translate(-50%, -50%);
    height: min(calc(100vh - 110px), 100vw * 760 / 600 * .9); aspect-ratio: 600 / 760; container-type: size; }
  #cuerpo, #cuerpo > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  #cuerpo img { object-fit: contain; }
  .zona { position: absolute; }

  /* ---- Gel: los botones brillantes de la época ---- */
  .gel { border: 1px solid color-mix(in srgb, var(--gel) 45%, black); border-radius: 999px; cursor: pointer; font: inherit; font-weight: 600;
    color: color-mix(in srgb, var(--gel) 22%, black);
    background: linear-gradient(180deg, rgba(255,255,255,.9) 0%, rgba(255,255,255,.3) 46%, transparent 52%),
      radial-gradient(ellipse at 50% 125%, color-mix(in srgb, var(--gel) 55%, white), var(--gel) 55%, color-mix(in srgb, var(--gel) 60%, black));
    box-shadow: inset 0 -3px 6px rgba(0,0,0,.25), 0 2px 5px rgba(0,0,0,.45); transition: transform .1s, filter .15s; }
  .gel:hover { filter: brightness(1.12); }
  .gel:active { transform: translateY(1px) scale(.97); box-shadow: inset 0 2px 6px rgba(0,0,0,.4); }

  /* ---- Pantalla ---- */
  /* Fondo propio: el filtro de color tiñe el cuerpo, pero la pantalla debe seguir negra-azul */
  #pantalla { border-radius: 8%; overflow: hidden; container-type: size;
    background: radial-gradient(ellipse at 50% 40%, #0a0f2a, #03050f); box-shadow: inset 0 0 2cqh rgba(0,0,0,.8); }
  #pantalla::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(165deg, rgba(255,255,255,.14) 0 22%, transparent 22%),
                repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
  #visor { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cab { position: absolute; left: 6%; right: 6%; top: 8%; display: flex; gap: 4cqw; align-items: center; }
  #caratula { width: 26cqh; height: 26cqh; object-fit: cover; border-radius: 3cqh; flex: none;
    box-shadow: 0 0 0 .6cqh var(--led), 0 0 3cqh color-mix(in srgb, var(--led) 60%, transparent); }
  .txt { min-width: 0; overflow: hidden; color: var(--led); text-shadow: 0 0 2cqh color-mix(in srgb, var(--led) 70%, transparent); }
  /* El título solo se desplaza si no cabe (--mov lo calcula el script) */
  #titulo { font-size: 11cqh; font-weight: 600; line-height: 1.1; white-space: nowrap; display: inline-block; }
  #titulo.largo { animation: pasar 9s ease-in-out 1.5s infinite alternate; }
  @keyframes pasar { to { transform: translateX(var(--mov)); } }
  #artista { font-size: 8.5cqh; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tiempo { position: absolute; right: 6%; top: 40%; font-size: 7.5cqh; color: var(--led); opacity: .8; }

  #botones { display: flex; justify-content: space-between; align-items: center; padding: 0 3%; }
  #botones button { width: 22%; height: 78%; font-size: 2.6cqh; font-family: "Segoe UI Symbol", "Fredoka", sans-serif; }
  #zonaBarra { display: flex; align-items: center; justify-content: center; }
  #barra { width: 88%; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 1.3cqh; margin: 0; border-radius: 999px; cursor: pointer;
    background: linear-gradient(90deg, var(--led) var(--p), rgba(0,0,0,.6) var(--p));
    box-shadow: inset 0 1px 3px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.35); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 2.6cqh; height: 2.6cqh; border-radius: 50%;
    border: 1px solid color-mix(in srgb, var(--gel) 45%, black);
    background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.3) 48%, transparent 52%), var(--gel);
    box-shadow: 0 1px 3px rgba(0,0,0,.5); }

  .ojo { border-radius: 50%; mix-blend-mode: screen; opacity: .2;
    background: radial-gradient(ellipse, #fff 0%, var(--led) 30%, transparent 70%); }
  #boca { display: flex; gap: 4%; align-items: center; padding: 0 6%; }
  #boca i { flex: 1; height: 55%; border-radius: 3px; background: var(--led); opacity: .12; box-shadow: 0 0 1cqh var(--led); }
  #boca i.on { opacity: 1; }
  #boca i.alto.on { background: #fff; }
  .anillo { border-radius: 50%; opacity: 0; pointer-events: none;
    box-shadow: inset 0 0 0 .5cqh var(--led), 0 0 3cqh var(--led), inset 0 0 3cqh var(--led); }

  /* ---- Barra de abajo: cuerpo, color y volumen ---- */
  #pie { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 18px;
    padding: 8px 18px; border-radius: 999px; font-size: 13px; white-space: nowrap;
    background: linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,.08) 50%, rgba(0,0,0,.25));
    border: 1px solid rgba(255,255,255,.35); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #pie .grupo { display: flex; align-items: center; gap: 6px; }
  #pie .nombre { opacity: .7; margin-right: 2px; }
  #cuerpos button { padding: 4px 12px; font-size: 12px; }
  #cuerpos button.elegido { box-shadow: 0 0 0 2px #fff, 0 0 12px var(--led); }
  #colores button { width: 22px; height: 22px; padding: 0; }
  #colores button.elegido { box-shadow: 0 0 0 2px #fff, 0 0 12px var(--led); }
  #volumen { width: 110px; height: 8px; }
  button#iconoVol { background: none; border: none; color: inherit; font: inherit; opacity: .7; cursor: pointer; padding: 0 2px; }
  button#iconoVol:hover { opacity: 1; }
  #pie button#bLista { padding: 4px 14px; font-size: 12px; }
  #pie button#bLista.elegido { box-shadow: 0 0 0 2px #fff, 0 0 12px var(--led); }

  /* ---- Cajón de la lista: gel que sale del costado ---- */
  #cajon { position: fixed; right: 16px; top: 54px; bottom: 76px; width: min(400px, calc(100vw - 32px)); z-index: 5; display: flex; flex-direction: column;
    border-radius: 28px; padding: 14px 8px 12px; transform: translateX(calc(100% + 40px)); transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .6s;
    background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.06) 40%, rgba(0,0,0,.35)), color-mix(in srgb, var(--fondo) 80%, black);
    border: 1px solid color-mix(in srgb, var(--gel) 60%, white); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 20px 50px rgba(0,0,0,.55), 0 0 40px color-mix(in srgb, var(--led) 25%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  body.conLista #cajon { transform: none; }
  #cajon .cab-lista { display: flex; justify-content: space-between; padding: 0 16px 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--led); }
  #cajon #lista { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--gel) transparent; }
  .fila { display: grid; grid-template-columns: 38px 26px 1fr 44px; align-items: center; gap: 10px; padding: 5px 14px; font-size: 14px; cursor: pointer; color: rgba(255,255,255,.78); }
  .fila:hover { background: rgba(255,255,255,.1); color: #fff; }
  .fila.sonando { color: #08200a; background: linear-gradient(180deg, rgba(255,255,255,.85), color-mix(in srgb, var(--gel) 85%, white)); font-weight: 600; }
  .fila img { width: 38px; height: 38px; object-fit: cover; border-radius: 8px; box-shadow: 0 0 0 1px rgba(255,255,255,.35); }
  .fila .nombre { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fila .n, .fila .dur { font-size: 11px; opacity: .8; }
  /* La cabeza se corre a un lado cuando el cajón está abierto, para no taparla */
  #cabeza { transition: left .35s cubic-bezier(.2,.8,.2,1); }
  @media (min-width: 1000px) { body.conLista #cabeza { left: calc(50% - 200px); } }
  a.volver { background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.12) 50%, rgba(0,0,0,.2)); color: #fff; border: 1px solid rgba(255,255,255,.6); opacity: .9;
    font: 600 12px Fredoka, sans-serif; text-shadow: 0 1px 2px rgba(0,0,0,.5); box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 4px 10px rgba(0,0,0,.4); }
  #volumen::-webkit-slider-thumb { width: 16px; height: 16px; }
</style>
</head>
<body>
<canvas id="fondo" data-fondo></canvas>
<div id="cabeza">
  <div id="cuerpo">
  </div>
  <div id="pantalla" class="zona">
    <canvas id="visor"></canvas>
    <div class="cab"><img id="caratula" alt=""><div class="txt"><div id="titulo">—</div><div id="artista"></div></div></div>
    <div id="tiempo">0:00 / 0:00</div>
  </div>
  <div id="botones" class="zona">
    <button id="bAnt" class="gel" title="Anterior">&#x23EE;&#xFE0E;</button>
    <button id="bPlay" class="gel" title="Play / pausa">▶</button>
    <button id="bSig" class="gel" title="Siguiente">&#x23ED;&#xFE0E;</button>
    <button id="bStop" class="gel" title="Detener">■</button>
  </div>
  <div id="zonaBarra" class="zona"><input id="barra" type="range" min="0" max="1000" value="0" title="Avance"></div>
  <div id="boca" class="zona"></div>
</div>
<aside id="cajon" class="ocultable" data-prop="lista"><div class="cab-lista"><span id="nombreFuente"></span><span id="cuenta"></span></div><div id="lista"></div></aside>
<div id="pie" class="ocultable">
  <div class="grupo"><button id="bLista" class="gel" data-prop="lista" title="Mostrar la lista de temas">Lista</button></div>
  <div class="grupo" id="cuerpos"><span class="nombre">Cuerpo</span></div>
  <div class="grupo" id="colores"><span class="nombre">Color</span></div>
  <div class="grupo"><button id="iconoVol" title="Silenciar">🔊</button><input id="volumen" type="range" min="0" max="100" value="80" title="Volumen"></div>
</div>

<script src="propiedades.js"></script>
<script src="nucleo.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const raiz = document.documentElement.style;
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const leer = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };

// Zonas de las imágenes de video maker (misma composición en las dos; pantalla y ojos medidos en píxeles).
const ZONAS_IMAGEN = {
  pantalla: [23.4, 23.4, 53.4, 38.6], botones: [33, 9.8, 34, 6.6], barra: [33, 64.6, 34, 4.2],
  ojos: [[24.5, 70.8, 15, 7.4], [61, 70.8, 15, 7.4]], boca: [43, 80.3, 14, 5],
  parlantes: [[5.3, 29.8, 11.4, 32.4], [83.3, 29.8, 11.4, 32.4]] };
// Cada cuerpo dice dónde van las piezas, en % de la caja [x, y, ancho, alto].
const CUERPOS = {
  "Y2K": { imagen: "img/headspace/y2k.webp", zonas: ZONAS_IMAGEN },
  "Gel": { imagen: "img/headspace/gel.webp", zonas: ZONAS_IMAGEN },
};
const COLORES = {
  "Lima":      { filtro: "", led: "#8dff4a", gel: "#9be22a", fondo: "#123a00" },
  "Chicle":    { filtro: "hue-rotate(235deg) saturate(1.1)", led: "#ff6ad5", gel: "#ff7ad9", fondo: "#3a0230" },
  "Cielo":     { filtro: "hue-rotate(115deg)", led: "#5ad1ff", gel: "#6cc8ff", fondo: "#002a44" },
  "Mandarina": { filtro: "hue-rotate(-50deg) saturate(1.15)", led: "#ffb03a", gel: "#ff9a2a", fondo: "#3a1600" },
  "Cromo":     { filtro: "saturate(0) brightness(1.1) contrast(1.05)", led: "#e8f0ff", gel: "#c9d3dc", fondo: "#1a1e24" },
};
let color = COLORES.Lima, ojos = [], anillos = [];

function ubicar(el, [x, y, w, h]) { Object.assign(el.style, { left: x + "%", top: y + "%", width: w + "%", height: h + "%" }); }
function usarCuerpo(nombre) {
  const c = CUERPOS[nombre];
  if (!c) return;
  const img = new Image(); img.src = c.imagen; img.alt = "";
  $("cuerpo").replaceChildren(img);
  const z = c.zonas;
  ubicar($("pantalla"), z.pantalla); ubicar($("botones"), z.botones); ubicar($("zonaBarra"), z.barra); ubicar($("boca"), z.boca);
  [...ojos, ...anillos].forEach(e => e.remove());
  ojos = z.ojos.map(r => { const e = document.createElement("div"); e.className = "zona ojo"; ubicar(e, r); $("cabeza").appendChild(e); return e; });
  anillos = z.parlantes.map(r => { const e = document.createElement("div"); e.className = "zona anillo"; ubicar(e, r); $("cabeza").appendChild(e); return e; });
  document.querySelectorAll("#cuerpos button").forEach(b => b.classList.toggle("elegido", b.dataset.c === nombre));
  guardar("cuerpo-headspace", nombre);
  aplicarFiltro();
}
function aplicarFiltro() { $("cuerpo").style.filter = `${color.filtro} drop-shadow(0 18px 30px rgba(0,0,0,.6))`; }
function usarColor(nombre) {
  color = COLORES[nombre] || COLORES.Lima;
  for (const k of ["led", "gel", "fondo"]) raiz.setProperty("--" + k, color[k]);
  aplicarFiltro();
  document.querySelectorAll("#colores button").forEach(b => b.classList.toggle("elegido", b.dataset.c === nombre));
  guardar("color-headspace", nombre);
}

for (const [nombre, c] of Object.entries(COLORES)) {
  const b = document.createElement("button");
  b.className = "gel"; b.dataset.c = nombre; b.title = nombre; b.style.setProperty("--gel", c.gel);
  b.onclick = () => usarColor(nombre);
  $("colores").appendChild(b);
}
for (const [nombre, c] of Object.entries(CUERPOS)) {
  const b = document.createElement("button");
  b.className = "gel"; b.dataset.c = nombre; b.textContent = nombre; b.onclick = () => usarCuerpo(nombre);
  $("cuerpos").appendChild(b);
}
for (let i = 0; i < 12; i++) { const s = document.createElement("i"); if (i > 8) s.className = "alto"; $("boca").appendChild(s); }
$("caratula").onerror = () => { $("caratula").style.visibility = "hidden"; };
$("caratula").onload = () => { $("caratula").style.visibility = "visible"; };

// ---- Lista: cajón que se abre con el botón; abierto al entrar si la fuente tiene lista ----
$("nombreFuente").textContent = { spotify: "Spotify", soundcloud: "Tus likes", musica: "Tu música", pc: "En el PC" }[R.fuente];
if (R.fuente === "pc") { $("bLista").hidden = true; }
function cajon(abierto) { document.body.classList.toggle("conLista", abierto); $("bLista").classList.toggle("elegido", abierto); guardar("lista-headspace", abierto ? "1" : "0"); }
$("bLista").onclick = () => cajon(!document.body.classList.contains("conLista"));
cajon(R.fuente !== "pc" && leer("lista-headspace") !== "0" && !document.body.classList.contains("sin-lista"));
// Título que no cabe en la pantalla: se desplaza; si cabe, queda quieto
function ajustarTitulo() {
  const t = $("titulo"), caja = t.parentElement, sobra = t.scrollWidth - caja.clientWidth;
  t.classList.remove("largo"); t.style.setProperty("--mov", "0px");
  if (sobra > 2) { t.style.setProperty("--mov", `-${sobra + 8}px`); void t.offsetWidth; t.classList.add("largo"); }
}
R.alCambiar((p) => { $("cuenta").textContent = R.fuente === "pc" ? "" : `${R.pistas.length} temas`; requestAnimationFrame(ajustarTitulo); });
usarColor(COLORES[leer("color-headspace")] ? leer("color-headspace") : "Lima");
const elegido = leer("cuerpo-headspace");
usarCuerpo(CUERPOS[elegido] ? elegido : "Y2K");

// ---- Fondo: burbujas que suben con el bajo y destellos con los agudos ----
const fondo = $("fondo"), fg = fondo.getContext("2d");
const burbujas = Array.from({ length: 34 }, () => ({ x: Math.random(), y: Math.random(), r: 8 + Math.random() * 46, v: 0.0004 + Math.random() * 0.0012 }));
const destellos = Array.from({ length: 26 }, () => ({ x: Math.random(), y: Math.random(), f: Math.random() * 6, s: 6 + Math.random() * 14 }));
function estrella(x, y, s) {
  fg.beginPath(); fg.moveTo(x, y - s);
  fg.quadraticCurveTo(x, y, x + s, y); fg.quadraticCurveTo(x, y, x, y + s);
  fg.quadraticCurveTo(x, y, x - s, y); fg.quadraticCurveTo(x, y, x, y - s); fg.fill();
}
function dibujarFondo(bajo, agudo, t) {
  if (fondo.width !== innerWidth || fondo.height !== innerHeight) { fondo.width = innerWidth; fondo.height = innerHeight; }
  const w = fondo.width, h = fondo.height;
  if (!w || !h) return;
  const g = fg.createRadialGradient(w / 2, h * 0.45, 0, w / 2, h * 0.45, Math.max(w, h) * 0.7);
  g.addColorStop(0, color.fondo); g.addColorStop(1, "#000");
  fg.fillStyle = g; fg.fillRect(0, 0, w, h);
  const halo = fg.createRadialGradient(w / 2, h * 0.45, 0, w / 2, h * 0.45, h * (0.35 + bajo * 0.25));
  halo.addColorStop(0, color.led + "55"); halo.addColorStop(1, color.led + "00");
  fg.globalAlpha = 0.25 + bajo * 0.75; fg.fillStyle = halo; fg.fillRect(0, 0, w, h); fg.globalAlpha = 1;
  for (const b of burbujas) {
    b.y -= b.v * (1 + bajo * 5);
    if (b.y < -0.1) { b.y = 1.1; b.x = Math.random(); }
    const x = b.x * w + Math.sin(t * 0.6 + b.r) * 12, y = b.y * h, r = b.r * (1 + bajo * 0.25);
    fg.fillStyle = color.led + "14"; fg.strokeStyle = "rgba(255,255,255,.22)"; fg.lineWidth = 1.2;
    fg.beginPath(); fg.arc(x, y, r, 0, 7); fg.fill(); fg.stroke();
    fg.fillStyle = "rgba(255,255,255,.35)";
    fg.beginPath(); fg.ellipse(x - r * 0.35, y - r * 0.4, r * 0.28, r * 0.14, -0.6, 0, 7); fg.fill();
  }
  fg.fillStyle = "#fff";
  for (const d of destellos) {
    const a = Math.max(0, Math.sin(t * 2.2 + d.f)) * (0.15 + agudo * 2.2);
    if (a < 0.03) continue;
    fg.globalAlpha = Math.min(1, a); estrella(d.x * w, d.y * h, d.s * (0.6 + a * 0.6));
  }
  fg.globalAlpha = 1;
}

// ---- Pantalla: barras LED con picos ----
const visor = $("visor"), vg = visor.getContext("2d"), picos = new Array(30).fill(0);
function dibujarPantalla(d) {
  const r = visor.getBoundingClientRect();
  if (visor.width !== Math.round(r.width) || visor.height !== Math.round(r.height)) { visor.width = Math.round(r.width); visor.height = Math.round(r.height); }
  const w = visor.width, h = visor.height;
  if (!w || !h) return;
  vg.clearRect(0, 0, w, h);
  const n = picos.length, base = h * 0.93, alto = h * 0.42, ancho = w * 0.88 / n, SEG = 12;
  vg.shadowColor = color.led; vg.shadowBlur = 6;
  for (let i = 0; i < n; i++) {
    const i0 = Math.floor(2 * Math.pow(120, i / n)), i1 = Math.max(i0 + 1, Math.floor(2 * Math.pow(120, (i + 1) / n)));
    const v = Math.pow(R.energia(d, i0, i1), 1.6);
    picos[i] = Math.max(picos[i] - 0.01, v);
    const x = w * 0.06 + i * ancho, segs = Math.round(v * SEG);
    for (let s = 0; s < segs; s++) {
      vg.fillStyle = s >= SEG - 2 ? "#ffffff" : color.led;
      vg.fillRect(x, base - (s + 1) * alto / SEG, ancho * 0.7, alto / SEG - 2);
    }
    vg.fillStyle = "#fff";
    vg.fillRect(x, base - picos[i] * alto - 3, ancho * 0.7, 2);
  }
  vg.shadowBlur = 0;
}

// ---- Cada cuadro ----
const segBoca = $("boca").children;
R.cadaCuadro((t) => {
  const d = R.espectro();
  const bajo = R.energia(d, 1, 8), medio = R.energia(d, 8, 60), agudo = R.energia(d, 60, 200);
  dibujarFondo(bajo, agudo, t);
  dibujarPantalla(d);
  raiz.setProperty("--p", (R.progreso() * 100).toFixed(2) + "%");
  ojos.forEach(o => { o.style.opacity = (0.12 + medio * 1.3).toFixed(2); });
  anillos.forEach(a => { a.style.opacity = Math.min(1, bajo * 1.3).toFixed(2); a.style.transform = `scale(${(0.85 + bajo * 0.3).toFixed(3)})`; });
  const encendidos = Math.round(medio * 18);
  for (let i = 0; i < segBoca.length; i++) segBoca[i].classList.toggle("on", i < encendidos);
});
</script>
</body>
</html>
